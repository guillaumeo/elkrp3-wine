services:
  elkrp3:
    build: .
    image: local/elkrp3-wine:noble
    container_name: elkrp3
    init: true
    user: "1000:1000"
    environment:
      - TZ=${TZ:-UTC}
    ports:
      - "${ELKRP3_BIND:-127.0.0.1}:3000:3000"
    volumes:
      - ./database:/database
    shm_size: "1gb"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: "no"
